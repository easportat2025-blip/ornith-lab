<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select and submit</title>
<style>
  html,body{margin:0;height:100%;font:16px system-ui,sans-serif;background:#14181f;color:#e8edf5;}
  header{background:#1d2531;padding:12px 20px;font-weight:700;letter-spacing:.5px;}
  main{max-width:900px;margin:0 auto;padding:18px;}
  .hint{color:#9fb0c3;font-size:15px;margin:0 0 14px;}
  .grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .chip{background:#1b222d;border:1px solid #384454;border-radius:20px;padding:9px 16px;font-size:15px;cursor:pointer;user-select:none;}
  .chip.sel{background:#2f6fed;border-color:#2f6fed;color:#fff;}
  button.big{background:#2f6fed;color:#fff;border:0;border-radius:6px;padding:11px 20px;font-size:15px;cursor:pointer;}
  button.big:disabled{background:#3a4553;cursor:not-allowed;}
  #counter{font-size:16px;color:#9fb0c3;margin-bottom:10px;}
  #cnt{color:#e8edf5;font-weight:700;}
  #status{margin-top:10px;font-size:15px;color:#e8b04b;min-height:20px;}
</style>
</head>
<body data-count="0" data-rejected="0" data-submitted="0">
<header>SELECTION BATCH</header>
<main>
  <p class="hint">Select exactly <b id="target">5</b> items, then submit the batch.</p>
  <div id="counter">Selected: <span id="cnt">0</span> / <span id="tc">5</span></div>
  <div class="grid" id="grid"></div>
  <button class="big" id="subbtn">Submit batch</button>
  <div id="status"></div>
</main>
<script>
var N=18;
var V=Math.min(2,Math.max(0,parseInt((location.search.match(/[?&]v=(\d)/)||[0,0])[1],10)));
var TARGETCOUNT=[4,6,7][V];
document.getElementById("target").textContent=TARGETCOUNT;
document.getElementById("tc").textContent=TARGETCOUNT;
document.body.dataset.targetcount=String(TARGETCOUNT);
var grid=document.getElementById("grid"),cnt=document.getElementById("cnt"),
    subbtn=document.getElementById("subbtn"),statusEl=document.getElementById("status");
for(var i=1;i<=N;i++){
  var c=document.createElement("div");
  c.className="chip";c.textContent="Item "+i;c.dataset.on="0";
  c.addEventListener("click",function(){
    var on=this.dataset.on==="1";
    this.dataset.on=on?"0":"1";
    this.classList.toggle("sel",!on);
    var n=grid.querySelectorAll('.chip[data-on="1"]').length;
    cnt.textContent=n;
    document.body.dataset.count=n;
  });
  grid.appendChild(c);
}
subbtn.addEventListener("click",function(){
  var n=grid.querySelectorAll('.chip[data-on="1"]').length;
  if(n!==TARGETCOUNT){
    document.body.dataset.rejected="1";
    statusEl.textContent="Rejected: "+n+" selected, need exactly "+TARGETCOUNT+".";
    return;
  }
  document.body.dataset.submitted="1";
  statusEl.textContent="Batch submitted with "+n+" items.";
});
</script>
</body>
</html>
