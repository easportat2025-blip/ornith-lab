<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T11 counter</title>
<style>
  :root { --accent:#16a34a; --bg:#f2faf3; }
  body.v1 { --accent:#d97706; --bg:#fbf7f0; }
  body.v2 { --accent:#2563eb; --bg:#f3f6fb; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .card { background:#fff; max-width:380px; margin:44px auto; padding:28px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:18px; color:var(--accent); margin:0 0 18px; }
  #count { font-size:52px; font-weight:800; color:#0f172a; }
  .btns { margin-top:20px; display:flex; gap:10px; justify-content:center; }
  .btns button { border:0; padding:12px 22px; border-radius:8px; font-size:15px; cursor:pointer; }
  #inc { background:var(--accent); color:#fff; }
  #sub { background:#0f172a; color:#fff; }
  #msg { display:none; margin-top:16px; padding:12px; border-radius:6px; font-size:14px; }
  #msg.good { background:#dcfce7; color:#166534; }
  #msg.bad { background:#fee2e2; color:#b91c1c; }
</style>
</head>
<body class="v0" data-count="0" data-submitted="0" data-incname="">
<div class="card">
  <h1>Click counter</h1>
  <div id="count">0</div>
  <div class="btns">
    <button type="button" id="inc">+1</button>
    <button type="button" id="sub">Submit</button>
  </div>
  <div id="msg"></div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {inc:"+1", target:5},
  {inc:"Add one", target:5},
  {inc:"+1 click", target:5}
][V];
document.getElementById("inc").textContent = CFG.inc;
document.body.dataset.incname = CFG.inc;
document.body.dataset.targetcount = String(CFG.target);
let count = 0;
const countEl = document.getElementById("count"), msg = document.getElementById("msg");
document.getElementById("inc").addEventListener("click", () => {
  count++;
  countEl.textContent = String(count);
  document.body.dataset.count = String(count);
});
document.getElementById("sub").addEventListener("click", () => {
  document.body.dataset.submitted = "1";
  if (count === CFG.target) {
    msg.className = "good";
    msg.textContent = "Submitted with count " + count + " — correct.";
  } else {
    msg.className = "bad";
    msg.textContent = "Submitted with count " + count + " — it should be " + CFG.target + ".";
  }
  msg.style.display = "block";
});
window.__task_ok = false;
</script>
</body>
</html>
