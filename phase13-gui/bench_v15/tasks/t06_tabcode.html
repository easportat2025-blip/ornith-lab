<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T06 tabcode</title>
<style>
  :root { --accent:#2563eb; --bg:#f3f6fb; }
  body.v1 { --accent:#9333ea; --bg:#f8f3fb; }
  body.v2 { --accent:#c026d3; --bg:#faf2fb; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .card { background:#fff; max-width:560px; margin:36px auto; padding:26px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:18px; color:var(--accent); margin:0 0 14px; }
  .tabs { display:flex; gap:6px; border-bottom:2px solid #e2e8f0; }
  .tab { padding:8px 16px; font-size:14px; cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; color:#64748b; background:#f8fafc; }
  .tab.on { background:#fff; border-color:#e2e8f0; color:var(--accent); font-weight:600; }
  .panel { padding:18px 4px 4px; }
  #code_text { font-family:ui-monospace, monospace; font-size:30px; letter-spacing:6px; background:#0f172a; color:#4ade80; padding:14px 18px; border-radius:8px; display:inline-block; }
  label { display:block; font-size:13px; margin:14px 0 4px; color:#444; }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; font-family:ui-monospace, monospace; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:6px; font-size:14px; cursor:pointer; }
  #result { display:none; margin-top:12px; padding:12px; border-radius:6px; font-size:14px; }
  #result.good { background:#dcfce7; color:#166534; }
  #result.bad { background:#fee2e2; color:#b91c1c; }
</style>
</head>
<body class="v0" data-tab="home" data-submitted="" data-correct="0">
<div class="card">
  <h1>Portal</h1>
  <div class="tabs">
    <div class="tab on" id="tab_home">Home</div>
    <div class="tab" id="tab_code">Code</div>
  </div>
  <div class="panel" id="panel_home">
    <p style="font-size:14px;color:#444;margin-top:0">Enter the access code to continue.</p>
    <label for="code_in">Access code</label>
    <input type="text" id="code_in" autocomplete="off" maxlength="8">
    <button type="button" id="submit_code">Submit</button>
    <div id="result"></div>
  </div>
  <div class="panel" id="panel_code" style="display:none">
    <p style="font-size:14px;color:#444;margin-top:0">Your one-time code:</p>
    <div id="code_text"></div>
  </div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {code:"K7Q2"},
  {code:"M3X9"},
  {code:"R8V5"}
][V];
document.getElementById("code_text").textContent = CFG.code;
function showTab(name) {
  document.body.dataset.tab = name;
  document.getElementById("tab_home").classList.toggle("on", name === "home");
  document.getElementById("tab_code").classList.toggle("on", name === "code");
  document.getElementById("panel_home").style.display = name === "home" ? "block" : "none";
  document.getElementById("panel_code").style.display = name === "code" ? "block" : "none";
}
document.getElementById("tab_home").addEventListener("click", () => showTab("home"));
document.getElementById("tab_code").addEventListener("click", () => showTab("code"));
const result = document.getElementById("result");
document.getElementById("submit_code").addEventListener("click", () => {
  const v = document.getElementById("code_in").value.trim();
  document.body.dataset.submitted = v;
  if (v === CFG.code) {
    document.body.dataset.correct = "1";
    result.className = "good";
    result.textContent = "Code accepted.";
    result.style.display = "block";
  } else {
    document.body.dataset.correct = "0";
    result.className = "bad";
    result.textContent = "Wrong code — check the Code tab.";
    result.style.display = "block";
  }
});
window.__task_ok = false;
</script>
</body>
</html>
