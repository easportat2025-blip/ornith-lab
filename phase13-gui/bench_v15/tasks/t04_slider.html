<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T04 slider</title>
<style>
  :root { --accent:#db2777; --bg:#faf3f7; }
  body.v1 { --accent:#4338ca; --bg:#f3f4fb; }
  body.v2 { --accent:#15803d; --bg:#f2faf3; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .card { background:#fff; max-width:600px; margin:40px auto; padding:26px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:18px; color:var(--accent); margin:0 0 6px; }
  p.hint { font-size:13px; color:#555; margin:0 0 22px; }
  #target { font-size:15px; font-weight:600; color:#111; margin-bottom:14px; }
  #slider { width:100%; }
  .scale { display:flex; justify-content:space-between; font-size:11px; color:#888; margin-top:4px; }
  #val { margin-top:18px; font-size:16px; font-weight:600; }
  #ok { display:none; margin-top:12px; background:#dcfce7; color:#166534; padding:12px; border-radius:6px; font-size:15px; }
</style>
</head>
<body class="v0" data-target="0" data-value="50">
<div class="card">
  <h1>Set the slider</h1>
  <p class="hint">Click the track at the right spot or use arrow keys after clicking the slider.</p>
  <div id="target">Target: <span id="target_val"></span>%</div>
  <input type="range" id="slider" min="0" max="100" step="1" value="50">
  <div class="scale"><span>0</span><span>50</span><span>100</span></div>
  <div id="val">Current: <span id="cur">50</span>%</div>
  <div id="ok">Exact value reached — you can say DONE.</div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {target:72, start:50},
  {target:38, start:65},
  {target:91, start:20}
][V];
document.body.dataset.target = String(CFG.target);
const slider = document.getElementById("slider");
slider.value = String(CFG.start);
document.getElementById("target_val").textContent = String(CFG.target);
const cur = document.getElementById("cur"), ok = document.getElementById("ok");
function refresh() {
  const v = parseInt(slider.value, 10);
  document.body.dataset.value = String(v);
  cur.textContent = String(v);
  ok.style.display = (v === CFG.target) ? "block" : "none";
}
slider.addEventListener("input", refresh);
refresh();
window.__task_ok = false;
</script>
</body>
</html>
