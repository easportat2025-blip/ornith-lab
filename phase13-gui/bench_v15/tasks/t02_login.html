<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T02 login</title>
<style>
  :root { --accent:#4f46e5; --bg:#f5f5f8; }
  body.v1 { --accent:#be123c; --bg:#faf2f4; }
  body.v2 { --accent:#0f766e; --bg:#f0fafa; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .card { background:#fff; max-width:440px; margin:36px auto; padding:26px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:19px; margin:0 0 14px; color:var(--accent); }
  .note { background:#fef9c3; border:1px solid #fde047; color:#713f12; font-size:12px; padding:8px 10px; border-radius:6px; margin-bottom:14px; line-height:1.5; }
  label { display:block; font-size:13px; margin:12px 0 4px; color:#444; }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; }
  button { margin-top:18px; width:100%; background:var(--accent); color:#fff; border:0; padding:10px; border-radius:6px; font-size:14px; cursor:pointer; }
  #err { display:none; background:#fee2e2; color:#b91c1c; padding:8px 10px; border-radius:6px; font-size:13px; margin-bottom:10px; }
  #welcome { display:none; background:#dcfce7; color:#166534; padding:14px; border-radius:6px; font-size:15px; }
</style>
</head>
<body class="v0" data-loggedin="0" data-attempts="0" data-errorshown="0">
<div class="card">
  <h1>Sign in</h1>
  <div class="note" id="note">Username: <b id="note_user"></b><br>Password: <b id="note_pass"></b></div>
  <div id="err">Invalid credentials</div>
  <form id="form" onsubmit="return false">
    <label for="user">Username</label>
    <input type="text" id="user" autocomplete="off">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="off">
    <button type="button" id="signin">Sign in</button>
  </form>
  <div id="welcome">Welcome back!</div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {user:"admin",  pass:"rose42"},
  {user:"ops",    pass:"kiwi77"},
  {user:"root",   pass:"plum05"}
][V];
document.getElementById("note_user").textContent = CFG.user;
document.getElementById("note_pass").textContent = CFG.pass;
const err = document.getElementById("err"), ok = document.getElementById("welcome");
document.getElementById("signin").addEventListener("click", () => {
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value;
  document.body.dataset.attempts = String(parseInt(document.body.dataset.attempts || "0", 10) + 1);
  if (u === CFG.user && p === CFG.pass) {
    err.style.display = "none";
    ok.style.display = "block";
    document.body.dataset.loggedin = "1";
  } else {
    ok.style.display = "none";
    err.style.display = "block";
    document.body.dataset.errorshown = "1";
    document.body.dataset.loggedin = "0";
  }
});
window.__task_ok = false;
</script>
</body>
</html>
