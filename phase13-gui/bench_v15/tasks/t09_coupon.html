<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T09 coupon</title>
<style>
  :root { --accent:#0d9488; --bg:#f0f9f8; }
  body.v1 { --accent:#9333ea; --bg:#f8f3fb; }
  body.v2 { --accent:#c2410c; --bg:#fbf4f0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .wrap { max-width:760px; margin:28px auto; }
  h1 { font-size:18px; color:var(--accent); }
  p.hint { font-size:13px; color:#555; margin:4px 0 18px; }
  .plans { display:flex; gap:14px; }
  .plan { flex:1; background:#fff; border:2px solid #e2e8f0; border-radius:10px; padding:16px; cursor:pointer; }
  .plan.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(13,148,136,.12); }
  .plan h3 { margin:0 0 6px; font-size:15px; }
  .plan .price { font-size:22px; font-weight:700; }
  .plan .per { font-size:12px; color:#888; }
  .coupon { margin-top:18px; display:flex; gap:8px; }
  .coupon input { flex:1; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; }
  .coupon button { background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:6px; font-size:14px; cursor:pointer; }
  #total_box { margin-top:16px; background:#fff; border-radius:10px; padding:14px 16px; font-size:15px; display:flex; justify-content:space-between; }
  #total { font-weight:700; }
  #confirm { margin-top:14px; background:#16a34a; color:#fff; border:0; padding:11px 20px; border-radius:6px; font-size:14px; cursor:pointer; }
  #confirm:disabled { background:#cbd5e1; cursor:not-allowed; }
  #msg { display:none; margin-top:12px; background:#dcfce7; color:#166534; padding:12px; border-radius:6px; font-size:14px; }
</style>
</head>
<body class="v0" data-selected="-1" data-applied="0" data-confirmed="0" data-total="">
<div class="wrap">
  <h1>Choose your plan</h1>
  <p class="hint">Pick the right plan, apply the coupon, verify the total, then confirm.</p>
  <div class="plans" id="plans"></div>
  <div class="coupon">
    <input type="text" id="coupon_in" placeholder="Coupon code" autocomplete="off">
    <button type="button" id="apply">Apply</button>
  </div>
  <div id="total_box"><span>Total</span><span id="total">—</span></div>
  <button type="button" id="confirm" disabled>Confirm order</button>
  <div id="msg">Order confirmed.</div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {names:["Basic","Pro","Team"], prices:[9, 19, 29], target:1, code:"SAVE10", disc:0.10},
  {names:["Starter","Business","Enterprise"], prices:[8, 16, 24], target:2, code:"TRIM20", disc:0.20},
  {names:["Lite","Standard","Premium"], prices:[12, 24, 36], target:1, code:"OK15", disc:0.15}
][V];
document.body.dataset.targetplan = String(CFG.target);
document.body.dataset.targetname = CFG.names[CFG.target];
document.body.dataset.code = CFG.code;
document.body.dataset.price = String(CFG.prices[CFG.target]);
document.body.dataset.disc = String(CFG.disc);
const plansEl = document.getElementById("plans");
let applied = false;
function expectedTotal() {
  return (CFG.prices[CFG.target] * (1 - CFG.disc)).toFixed(2);
}
function refreshTotal() {
  if (applied && parseInt(document.body.dataset.selected, 10) === CFG.target) {
    const t = expectedTotal();
    document.getElementById("total").textContent = "$" + t;
    document.body.dataset.total = t;
    document.getElementById("confirm").disabled = false;
  } else if (parseInt(document.body.dataset.selected, 10) >= 0) {
    const p = CFG.prices[parseInt(document.body.dataset.selected, 10)];
    document.getElementById("total").textContent = "$" + p.toFixed(2) + (applied ? " (coupon only applies to the target plan)" : "");
    document.body.dataset.total = "";
    document.getElementById("confirm").disabled = true;
  }
}
CFG.names.forEach((n, i) => {
  const d = document.createElement("div");
  d.className = "plan";
  d.id = "plan" + i;
  d.innerHTML = "<h3>" + n + "</h3><div class='price'>$" + CFG.prices[i] + "</div><div class='per'>per month</div>";
  d.addEventListener("click", () => {
    document.querySelectorAll(".plan").forEach(x => x.classList.remove("sel"));
    d.classList.add("sel");
    document.body.dataset.selected = String(i);
    refreshTotal();
  });
  plansEl.appendChild(d);
});
document.getElementById("apply").addEventListener("click", () => {
  const v = document.getElementById("coupon_in").value.trim().toUpperCase();
  if (v === CFG.code) {
    applied = true;
    document.body.dataset.applied = "1";
  } else {
    applied = false;
    document.body.dataset.applied = "0";
    document.getElementById("total").textContent = "invalid coupon";
    document.body.dataset.total = "";
    document.getElementById("confirm").disabled = true;
  }
  refreshTotal();
});
document.getElementById("confirm").addEventListener("click", () => {
  if (!document.getElementById("confirm").disabled) {
    document.body.dataset.confirmed = "1";
    document.getElementById("msg").style.display = "block";
  }
});
window.__task_ok = false;
</script>
</body>
</html>
