<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T07 scroll</title>
<style>
  :root { --accent:#ea580c; --bg:#fbf5f0; }
  body.v1 { --accent:#0f766e; --bg:#f0fafa; }
  body.v2 { --accent:#7c3aed; --bg:#f6f4fb; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .wrap { max-width:560px; margin:30px auto; }
  h1 { font-size:18px; color:var(--accent); }
  p.hint { font-size:13px; color:#555; margin:4px 0 14px; }
  #list { height:320px; overflow-y:auto; background:#fff; border:1px solid #e2e8f0; border-radius:10px; }
  .item { padding:12px 16px; border-bottom:1px solid #f1f5f9; font-size:14px; color:#334155; cursor:pointer; }
  .item:hover { background:#f8fafc; }
  .item.last { font-weight:700; color:var(--accent); }
  .item.clicked { background:#ffedd5; }
  #status { margin-top:12px; font-size:13px; color:#64748b; }
  #success { display:none; margin-top:10px; background:#dcfce7; color:#166534; padding:12px; border-radius:6px; font-size:15px; }
</style>
</head>
<body class="v0" data-loaded="0" data-total="0" data-clicked="" data-clickedcount="0" data-premature="0">
<div class="wrap">
  <h1>Product changelog</h1>
  <p class="hint">The list loads more entries as you scroll. Reach the very bottom, then click the last entry.</p>
  <div id="list" tabindex="0"></div>
  <div id="status"></div>
  <div id="success">You clicked the last entry!</div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {total:32, prefix:"Changelog entry"},
  {total:40, prefix:"Release note"},
  {total:36, prefix:"Update item"}
][V];
document.body.dataset.total = String(CFG.total);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(0x5C70100 + V * 104729);
const suffixes = [];
for (let i = 0; i < CFG.total; i++) suffixes.push(Math.floor(rnd() * 900) + 100);
const list = document.getElementById("list"), statusEl = document.getElementById("status"), ok = document.getElementById("success");
let loaded = 0;
function label(i) { return CFG.prefix + " " + (i + 1) + " (#" + suffixes[i] + ")"; }
function loadMore() {
  if (loaded >= CFG.total) return;
  const batch = Math.min(8, CFG.total - loaded);
  for (let k = 0; k < batch; k++) {
    const i = loaded + k;
    const d = document.createElement("div");
    d.className = "item" + (i === CFG.total - 1 ? " last" : "");
    d.id = "item" + i;
    d.textContent = label(i);
    d.addEventListener("click", () => {
      list.focus();
      document.body.dataset.clicked = String(i);
      document.body.dataset.clickedcount = String(loaded);
      if (loaded < CFG.total) {
        document.body.dataset.premature = String(parseInt(document.body.dataset.premature || "0", 10) + 1);
        statusEl.textContent = "More entries are still loading — keep scrolling.";
      } else {
        d.classList.add("clicked");
        if (i === CFG.total - 1) {
          ok.style.display = "block";
          statusEl.textContent = "";
        }
      }
    });
    list.appendChild(d);
  }
  loaded += batch;
  document.body.dataset.loaded = String(loaded);
  statusEl.textContent = loaded < CFG.total ? "Loading as you scroll… " + loaded + " entries so far."
                                            : "All " + CFG.total + " entries loaded.";
}
list.addEventListener("scroll", () => {
  if (list.scrollTop + list.clientHeight >= list.scrollHeight - 8) loadMore();
});
loadMore();
window.__task_ok = false;
</script>
</body>
</html>
