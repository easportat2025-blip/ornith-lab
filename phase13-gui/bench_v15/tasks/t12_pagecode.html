<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T12 pagecode</title>
<style>
  :root { --accent:#7c3aed; --bg:#f6f4fb; }
  body.v1 { --accent:#0f766e; --bg:#f0fafa; }
  body.v2 { --accent:#c2410c; --bg:#fbf4f0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); margin:0; padding:24px; }
  .card { background:#fff; max-width:520px; margin:36px auto; padding:26px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:18px; color:var(--accent); margin:0 0 14px; }
  #code1 { font-family:ui-monospace, monospace; font-size:28px; letter-spacing:5px; background:#0f172a; color:#fbbf24; padding:12px 16px; border-radius:8px; display:inline-block; margin:6px 0 16px; }
  a.navlink { color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; }
  label { display:block; font-size:13px; margin:14px 0 4px; color:#444; }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; font-family:ui-monospace, monospace; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:6px; font-size:14px; cursor:pointer; }
  #result { display:none; margin-top:12px; padding:12px; border-radius:6px; font-size:14px; }
  #result.good { background:#dcfce7; color:#166534; }
  #result.bad { background:#fee2e2; color:#b91c1c; }
</style>
</head>
<body class="v0" data-page="1" data-submitted="" data-correct="0">
<div class="card">
  <div id="page1">
    <h1>Step 1 of 2</h1>
    <p style="font-size:14px;color:#444;margin:0 0 4px">Your verification code:</p>
    <div id="code1"></div>
    <div><a class="navlink" id="to2">Open page 2 →</a></div>
  </div>
  <div id="page2" style="display:none">
    <h1>Step 2 of 2</h1>
    <p style="font-size:14px;color:#444;margin:0 0 4px">Enter the code you saw on page 1.</p>
    <label for="code_in">Verification code</label>
    <input type="text" id="code_in" autocomplete="off" maxlength="8">
    <button type="button" id="sub2">Submit</button>
    <div style="margin-top:12px"><a class="navlink" id="to1">← Back to page 1</a></div>
    <div id="result"></div>
  </div>
</div>
<script>
"use strict";
const V = Math.min(2, Math.max(0, parseInt(new URLSearchParams(location.search).get("v") || "0", 10)));
document.body.className = "v" + V;
const CFG = [
  {code:"481927"},
  {code:"703516"},
  {code:"295840"}
][V];
document.getElementById("code1").textContent = CFG.code;
function show(p) {
  document.body.dataset.page = String(p);
  document.getElementById("page1").style.display = p === 1 ? "block" : "none";
  document.getElementById("page2").style.display = p === 2 ? "block" : "none";
}
document.getElementById("to2").addEventListener("click", () => show(2));
document.getElementById("to1").addEventListener("click", () => show(1));
const result = document.getElementById("result");
document.getElementById("sub2").addEventListener("click", () => {
  const v = document.getElementById("code_in").value.trim();
  document.body.dataset.submitted = v;
  if (v === CFG.code) {
    document.body.dataset.correct = "1";
    result.className = "good";
    result.textContent = "Code verified.";
  } else {
    document.body.dataset.correct = "0";
    result.className = "bad";
    result.textContent = "Wrong code — check page 1 again.";
  }
  result.style.display = "block";
});
window.__task_ok = false;
</script>
</body>
</html>
