<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archive - desktop env</title>
<style>
  body{margin:0;background:#f2f4f8;font:16px system-ui,sans-serif}
  #banner{position:absolute;left:0;top:0;width:100%;height:90px;background:#ffe9a8;
         border-bottom:2px solid #d9b64a;display:flex;align-items:center;
         justify-content:center;font-size:20px;z-index:9}
  #banner.gone{display:none}
  h1{font-size:24px;margin:0 0 4px;padding:104px 80px 0}
  .tip{padding:0 80px 12px;color:#5a6472;font-size:15px}
  #list{position:absolute;left:80px;top:180px;width:820px;height:470px;
        overflow-y:auto;background:#fff;border:1px solid #c3cbd6;border-radius:8px;
        outline:none}
  #list:focus{box-shadow:0 0 0 2px #4a90d9}
  .item{height:30px;padding:6px 14px;font-size:15px;border-bottom:1px solid #eef1f5;
        cursor:pointer}
  .item.target{background:#d8ecff;font-weight:700}
  .code{position:absolute;right:80px;top:200px;background:#fff8dc;
        border:1px solid #d8c97a;border-radius:8px;padding:16px 20px;width:280px;
        font-size:17px;line-height:1.8}
  .code b{color:#8a6d1a}
</style>
</head>
<body>
<div id="banner">Press ESC to dismiss this notice</div>
<h1>Archive</h1>
<div class="tip">Press ESC to dismiss the notice, then scroll down to the bottom of the list, then click the row whose code matches the note.</div>
<div id="list" tabindex="0"></div>
<div class="code" id="note">
  <b>Note</b><br>
  target code: <b id="ncode">?</b>
</div>
<script>
  function rnd(n){return Math.floor(Math.random()*n);}
  function code(){var L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";var s="";
    for(var i=0;i<6;i++)s+=L[rnd(L.length)];return s;}
  var SPEC={code:code()};
  window.__spec=SPEC;
  document.getElementById('ncode').textContent=SPEC.code;
  var list=document.getElementById('list');
  var N=60;
  for(var i=0;i<N;i++){
    var d=document.createElement('div');
    d.className='item'; d.setAttribute('data-label','row-'+i);
    d.textContent='row-'+i+' - file '+code();
    if(i===N-1){d.classList.add('target'); d.setAttribute('data-target','1');
      d.textContent='row-'+i+' - TARGET '+SPEC.code;}
    list.appendChild(d);
  }
  var KEYS=[];
  window.__keys=KEYS;
  window.__scrolled=false;
  window.__state={clicked:'',ok:0};
  // toa do chuan hoa 0..1000 (cap nhat lai sau khi scroll)
  function nrect(el){var r=el.getBoundingClientRect();
    return [Math.round((r.left+r.width/2)/window.innerWidth*1000),
            Math.round((r.top+r.height/2)/window.innerHeight*1000)];}
  function pubTargets(){
    var t=list.querySelector('[data-target="1"]');
    window.__targets={target:t?nrect(t):null};}
  pubTargets();
  // L4 (lint cua @MiMo): panel trong phai TU FOCUS() de ban phim cuon duoc
  // ngay (khong can agent phai click vao panel truoc).
  list.focus();
  document.addEventListener('keydown',function(e){
    KEYS.push(e.key);
    if(e.key==='Escape'){document.getElementById('banner').classList.add('gone');}
    // L4/L5 (lint cua @MiMo): panel overflow phai FOCUS + tu cuon bang phim
    // (PageDown/End) - vi biet se cho nguoi dung loi "cuon bang chuot" vo dung.
    if(e.key==='PageDown'||e.key==='End'||e.key==='ArrowDown'||e.key===' '){
      if(list.scrollHeight>list.clientHeight+4){
        if(e.key==='End'||e.key===' '){
          list.scrollTop=list.scrollHeight;
        }else{
          list.scrollTop+=Math.floor(list.clientHeight*0.8);
        }
        list.dispatchEvent(new Event('scroll'));
        e.preventDefault&&e.preventDefault();
      }
    }
  });
  list.addEventListener('scroll',function(){
    if(list.scrollTop+list.clientHeight>=list.scrollHeight-4) window.__scrolled=true;
    pubTargets();
  });
  list.addEventListener('click',function(e){
    var t=e.target;
    if(t && t.getAttribute){ window.__state.clicked=t.getAttribute('data-label')||t.textContent; }
    var ok=(window.__scrolled && KEYS.indexOf('Escape')>=0 &&
            t && t.getAttribute && t.getAttribute('data-target')==='1')?1:0;
    window.__state.ok=ok;
    document.body.setAttribute('data-ok',String(ok));
  });
</script>
</body>
</html>
