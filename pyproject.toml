[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "data",
    "dl-loop",
    "harness",
    "phase13-gui/kernel_*/output",
]

[tool.ruff.lint]
# Keep CI useful without forcing a legacy-code cleanup in one step.
select = ["E9", "F63", "F7", "F82"]
