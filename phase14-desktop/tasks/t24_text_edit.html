<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text Editor — desktop env</title>
<style>
  body{margin:0;background:#20242c;font:15px system-ui,sans-serif;color:#e6e9ef}
  .wrap{max-width:900px;margin:0 auto;padding:22px}
  h1{font-size:21px;margin:0 0 3px}
  .sub{color:#98a2b6;font-size:13px;margin-bottom:14px}
  .card{background:#272c36;border:1px solid #39404e;border-radius:10px;padding:16px}
  .brief{background:#2f3644;border:1px solid #46506a;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:15px}
  .brief b{color:#8fd0ff}
  textarea{width:100%;height:150px;background:#1b1f27;color:#e6e9ef;border:1px solid #46506a;
           border-radius:8px;padding:12px;font:14px ui-monospace,Menlo,Consolas,monospace;resize:none}
  textarea:focus{outline:2px solid #4a86e8}
  .row{display:flex;gap:12px;align-items:center;margin-top:12px}
  button{background:#4a86e8;color:#fff;border:0;border-radius:6px;padding:10px 20px;font-size:15px;cursor:pointer}
  button:disabled{background:#4d5769;cursor:not-allowed}
  #status{font-size:14px;color:#8fd0ff;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Release Notes Editor</h1>
  <div class="sub">Replace the whole text with the sentence shown below, then save.</div>
  <div class="card">
    <div class="brief">New text: <b id="want">?</b></div>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="row">
      <button id="save" disabled>Save file</button>
      <span id="status"></span>
    </div>
  </div>
</div>
<script>
/* TASK-26 T24_text_edit
   Bien NGAU NHIEN: cau can go va noi dung ban dau doi moi lan chay.
   Task dung BAN PHIM: click vao textarea -> Ctrl+A (chon het) -> TYPE cau moi.
   Checker DOC DOM: gia tri textarea + noi dung can go (trong #want). */
const R=(a)=>a[Math.floor(Math.random()*a.length)];
const W1=R(["Ship","Deploy","Release","Patch","Rollback","Hotfix"]);
const W2=R(["login","payment","search","export","upload","import"]);
const W3=R(["faster","stable","safer","quieter","smaller"]);
const WANT=W1+" "+W2+" is "+W3+" now.";
document.getElementById("want").textContent=WANT;
const OLD="TODO: rewrite these release notes before shipping to production.";
const ta=document.getElementById("ta"),save=document.getElementById("save"),
      statusEl=document.getElementById("status");
ta.value=OLD;
function ready(){
  const ok=ta.value.trim()===WANT;
  save.disabled=!ok;
  if(ok&&!statusEl.textContent) statusEl.textContent="Text matches - you can save.";
  return ok;
}
ta.addEventListener("input",function(){
  const was=statusEl.textContent; ready();
  if(statusEl.textContent===was && was) statusEl.textContent="";
});
function snapState(){window.__state={text:ta.value,status:statusEl.textContent};}
ta.addEventListener("input",snapState);
save.addEventListener("click",function(){
  if(save.disabled) return;
  statusEl.textContent="Saved.";
  snapState();
});
snapState();
window.__targets=(function(){
  const out={};
  ["ta","save"].forEach(function(id){
    const r=document.getElementById(id).getBoundingClientRect();
    out[id]=[Math.round((r.left+r.width/2)/window.innerWidth*1000),Math.round((r.top+r.height/2)/window.innerHeight*1000)];
  });
  return out;
})();
</script>
</body>
</html>
