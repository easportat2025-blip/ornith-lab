name: kaggle-watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      auto_push:
        description: "Push the next pending kernel when idle"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: kaggle-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --quiet kaggle==2.2.4

      - name: Poll Kaggle and optionally push next
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.auto_push }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--auto-push"
          fi
          python scripts/kaggle_watchdog_ci.py $ARGS

      - name: Publish state to ops-state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ornith-bot"
          git config user.email "ornith-bot@users.noreply.github.com"
          git checkout -B ops-state
          git add -f state/current.json
          git commit -m "ops: $(date -u +%FT%TZ)" || true
          git push -f origin ops-state

      - name: Update heartbeat issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let state = {};
            try { state = JSON.parse(fs.readFileSync('state/current.json', 'utf8')); } catch (e) {}
            const rows = (state.results || []).map(x => `| \`${x.ref}\` | ${x.status} | ${x.state} |`).join('\n');
            const body = [
              '## Kaggle watchdog',
              '',
              `- UTC: \`${new Date().toISOString()}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Active: \`${(state.active || []).join(', ') || 'none'}\``,
              '',
              '| kernel | status | state |',
              '|---|---|---|',
              rows || '| _none_ | | |',
              '',
              '_Updated every 10 minutes from GitHub Actions. No local watchdog needed._'
            ].join('\n');
            const title = '[ops] kaggle watchdog';
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100 });
            const hit = issues.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
