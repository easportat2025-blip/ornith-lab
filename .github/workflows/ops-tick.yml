name: ops-tick

# Self-dispatch loop for the ops watchdog.
#
# Why: GitHub throttles `schedule: */10` to roughly every 1-2 hours on busy
# repos. This workflow waits 10 minutes after a kaggle-watchdog run and then
# dispatches the next one, keeping the ops cadence near 10 minutes without a
# local watchdog.
#
# Loop:
#   kaggle-watchdog completed
#     -> ops-tick (sleep 600)
#     -> dispatch kaggle-watchdog (+ heartbeat)
#     -> kaggle-watchdog completed
#     -> ...
#
# The */10 schedule in kaggle-watchdog.yml is the backup seed. If this workflow
# is disabled or the token loses actions:write, the schedule resumes the loop.
#
# Note: the sleep consumes runner minutes. This is free for public repos; for a
# private repo, disable ops-tick or reduce the cadence.

on:
  workflow_run:
    workflows: ["kaggle-watchdog"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Seconds to wait before dispatching the next watchdog (0-3600)"
        required: false
        default: "600"

permissions:
  actions: write
  contents: read

concurrency:
  group: ops-tick
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cadence delay
        shell: bash
        env:
          DELAY: ${{ github.event.inputs.delay_seconds || '600' }}
        run: |
          case "$DELAY" in
            ''|*[!0-9]*) DELAY=600 ;;
          esac
          if [ "$DELAY" -gt 3600 ]; then DELAY=3600; fi
          echo "Waiting ${DELAY}s before dispatching kaggle-watchdog"
          sleep "$DELAY"

      - name: Dispatch ops workflows
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.repository.default_branch || 'main';

            async function dispatch(workflow_id, required) {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const payload = {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id,
                    ref,
                  };
                  if (workflow_id === 'kaggle-watchdog.yml') {
                    payload.inputs = { auto_push: 'true' };
                  }
                  await github.rest.actions.createWorkflowDispatch(payload);
                  core.info(`dispatched ${workflow_id} on ${ref} (attempt ${attempt})`);
                  return true;
                } catch (err) {
                  lastError = err;
                  core.warning(`dispatch ${workflow_id} attempt ${attempt} failed: ${err.message}`);
                  if (attempt < 3) await new Promise(r => setTimeout(r, 5000 * attempt));
                }
              }
              if (required) throw lastError;
              core.warning(`best-effort dispatch failed for ${workflow_id}`);
              return false;
            }

            await dispatch('kaggle-watchdog.yml', true);
            await dispatch('ops-heartbeat.yml', false);

            await core.summary
              .addRaw(`### ops-tick\n\nDispatched \`kaggle-watchdog.yml\` on \`${ref}\` at ${new Date().toISOString()}\n`)
              .write();
