name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile Python
        shell: bash
        run: |
          python -m compileall -q scripts tests
          if [ -d desktop_real ]; then python -m compileall -q desktop_real; fi
          for f in \
            phase13-gui/kernel_v25b/gui_sft_v23.py \
            phase13-gui/kernel_v26/gui_sft_v23.py \
            phase13-gui/kernel_bench_b17/bench_v15_kernel.py; do
            if [ -f "$f" ]; then python -m py_compile "$f"; fi
          done

      - name: Validate YAML and JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for p in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(p.read_text(encoding="utf-8"))
              print("yaml ok", p)
          for p in [Path(".github/dependabot.yml")]:
              if p.exists():
                  yaml.safe_load(p.read_text(encoding="utf-8"))
                  print("yaml ok", p)
          for p in sorted(Path("configs").glob("*.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print("json ok", p)
          for p in [Path(".devcontainer/devcontainer.json")]:
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print("json ok", p)
          PY

      - name: Secret scan (tracked files only)
        run: python scripts/secret_scan.py --tracked-only

      - name: Unit tests
        run: python -m pytest -q

      - name: Job registry tests
        shell: bash
        run: |
          if [ -d scripts/jobs ]; then
            python -m unittest discover -s scripts/jobs -p "test_*.py" -v
          fi

      - name: Headless API smoke
        shell: bash
        run: |
          python scripts/oc_chat/server.py --help >/dev/null
          python scripts/oc_chat/client.py --help >/dev/null
          python scripts/idle_ping.py --once --dry-run
